<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteShop - Modern Ecommerce</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #f5f5f5;
}

/* NAVBAR */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: #111;
    color: white;
    position: sticky;
    top: 0;
    z-index: 1000;
}

nav h1 {
    font-size: 24px;
    color: #00d4ff;
}

nav ul {
    display: flex;
    gap: 20px;
    list-style: none;
}

nav ul li {
    cursor: pointer;
}

.cart {
    background: #00d4ff;
    padding: 8px 15px;
    border-radius: 20px;
    color: black;
    font-weight: bold;
}

/* HERO */
.hero {
    height: 90vh;
    background: url('https://images.unsplash.com/photo-1607082349566-187342175e2f') center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
}

.hero h2 {
    font-size: 50px;
    margin-bottom: 10px;
}

.hero button {
    padding: 12px 25px;
    border: none;
    background: #00d4ff;
    cursor: pointer;
    font-size: 18px;
}

/* PRODUCTS */
.section {
    padding: 50px;
}

.section h2 {
    text-align: center;
    margin-bottom: 30px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.card .info {
    padding: 15px;
}

.card button {
    width: 100%;
    padding: 10px;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
}

.card button:hover {
    background: #00d4ff;
    color: black;
}

/* BANNER */
.banner {
    height: 300px;
    background: url('https://images.unsplash.com/photo-1512436991641-6745cdb1723f') center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 30px;
}

/* FOOTER */
footer {
    background: #111;
    color: white;
    padding: 30px;
    text-align: center;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <h1>EliteShop</h1>
    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
    <div class="cart">Cart: <span id="cart-count">0</span></div>
</nav>

<!-- HERO -->
<div class="hero">
    <div>
        <h2>Shop The Future</h2>
        <p>Trendy Products, Best Prices</p>
        <button onclick="scrollToProducts()">Shop Now</button>
    </div>
</div>

<!-- PRODUCTS -->
<div class="section" id="products">
    <h2>Featured Products</h2>
    <div class="products">

        <!-- Product 1 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1512499617640-c2f999098c01">
            <div class="info">
                <h3>Headphones</h3>
                <p>$99</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f">
            <div class="info">
                <h3>Camera</h3>
                <p>$499</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
            <div class="info">
                <h3>Sneakers</h3>
                <p>$120</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552">
            <div class="info">
                <h3>Smart Watch</h3>
                <p>$199</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>

        <!-- Product 5 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
            <div class="info">
                <h3>Backpack</h3>
                <p>$60</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>

        <!-- Product 6 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1600180758890-6b94519a8ba6">
            <div class="info">
                <h3>Jacket</h3>
                <p>$150</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>

    </div>
</div>

<!-- BANNER -->
<div class="banner">
    Big Sale - Up to 50% Off!
</div>

<!-- FOOTER -->
<footer>
    <p>© 2026 EliteShop | Designed with ❤️</p>
</footer>

<script>
let count = 0;

function addToCart() {
    count++;
    document.getElementById("cart-count").innerText = count;
}

function scrollToProducts() {
    document.getElementById("products").scrollIntoView({behavior: "smooth"});
}
</script>

</body>
</html>
